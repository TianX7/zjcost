<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c22" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>筑衡 — 全过程工程造价协同管控平台</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- SPA redirect handler for GitHub Pages 404.html -->
    <script>
      (function(){
        var redir = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (!redir || redir === location.href) return;
        try {
          var target = new URL(redir, location.href);
          var currentPath = location.pathname.replace(/\/+$/, "");
          var targetPath = target.pathname.replace(/\/+$/, "");
          var canRestore = (
            target.origin === location.origin &&
            targetPath.indexOf("/zjcost/") === 0 &&
            (currentPath === "/zjcost" || currentPath === "")
          );
          if (canRestore) {
            history.replaceState(null, null, target.pathname + target.search + target.hash);
          }
        } catch (e) {
          delete sessionStorage.redirect;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
